name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      # E9 = syntax errors, F = pyflakes (undefined names, unused imports/variables, …)
      - run: ruff check --select E9,F --output-format github skills/ tests/

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-deu
      # google-chrome is preinstalled on ubuntu-latest; render.sh finds it on PATH
      - run: skills/side-by-side-translation/scripts/facing/py doctor.py --lang deu
      - run: tests/smoke.sh
